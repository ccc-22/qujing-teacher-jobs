  const el = document.getElementById('list');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="big">📡</div>
      当前筛选下暂无在招机会。<br>系统每天自动扫描，有新公告会第一时间出现在这里。<br>也可以放宽地区或类型筛选试试。</div>`;
    el.style.display = 'block';
    return;
  }
  el.innerHTML = filtered.map(renderCard).join('');
}

function bindRow(rowId, key) {
  const row = document.getElementById(rowId);
  row.addEventListener('click', e => {
    const btn = e.target.closest('.seg');
    if (!btn) return;
    row.querySelectorAll('.seg').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    state[key] = btn.dataset[key];
    render();
  });
}
bindRow('rowSubject', 'subject');
bindRow('rowRegion', 'region');
bindRow('rowType', 'type');
document.getElementById('rowSubject').addEventListener('click', e => {
  const btn = e.target.closest('.seg');
  if (btn && btn.dataset.sort) {
    state.sort = btn.dataset.sort;
    rowSubject.querySelectorAll('[data-sort]').forEach(b => b.classList.toggle('on', b.dataset.sort === state.sort));
    render();
  }
});
render();
</script>
</body>
</html>
